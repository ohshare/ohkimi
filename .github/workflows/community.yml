name: Update Kimi Community

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kimi-community-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch community data
        env:
          KIMI_REFRESH_TOKEN: ${{ secrets.KIMI_REFRESH_TOKEN }}
        run: python fetch_community.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add community.json
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "chore: update community $(date -u +%Y-%m-%dT%H:%MZ)"; git push; fi
